services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      # - "3000:80"
      - "127.0.0.1:3000:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/app/data
      - ./config.json:/app/config.json
      - ./api:/app/api
      - ./services:/app/services
      - ./utils:/app/utils
      - ./scripts:/app/scripts
    environment:
      # 时区配置
      - TZ=Asia/Shanghai
      
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      - STORAGE_BACKEND=json
      
      # 代理配置（大写 + 小写兼容）
      - HTTP_PROXY=http://mihomo:7897
      - HTTPS_PROXY=http://mihomo:7897
      - ALL_PROXY=http://mihomo:7897
      - http_proxy=http://mihomo:7897
      - https_proxy=http://mihomo:7897
      - all_proxy=http://mihomo:7897
      # 排除容器本地与内网通信，防止代理拦截内部请求
      - NO_PROXY=localhost,127.0.0.1,app,mihomo
      - no_proxy=localhost,127.0.0.1,app,mihomo
    
    # 必须指定加入 external 网络
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true